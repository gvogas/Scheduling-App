# Lint and analysis configuration for the Scheduling App.
#
# Uses `very_good_analysis` as the strict baseline. The temporary
# `analyzer.errors:` allow-list from the clean-architecture restructure has
# been emptied — features are now expected to comply with the full ruleset.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # Generated by build_runner (freezed).
    - "**/*.freezed.dart"
    # Generated by `flutter gen-l10n` (output-dir in l10n.yaml).
    - "lib/l10n/.gen/**"
    # Hand-written dotenv shim mirroring the flutterfire-generated layout; its
    # SCREAMING_CAPS private fields intentionally break naming lints.
    - "lib/firebase_options.dart"
    # Build outputs.
    - "build/**"
    - ".dart_tool/**"
    # npm installs (tools/deploy ships firebase-tools' Dart templates).
    - "**/node_modules/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # This is an application, not a published package — documenting every public
    # member adds noise without value. `very_good_analysis` enables this for
    # package authors; it does not apply here.
    public_member_api_docs: false
    # pubspec.yaml is intentionally grouped by purpose with section comments
    # (Firebase, State management, …) rather than a flat alphabetical list.
    sort_pub_dependencies: false
    # The l10n convention names keys after their full English text (60+ chars),
    # and test cases are described in readable sentences. An 80-char limit fights
    # both — it would force splitting l10n keys and test descriptions, hurting
    # readability. Formatting (dart format) still governs general line wrapping.
    lines_longer_than_80_chars: false
    # Fire-and-forget is a deliberate convention here: notices, navigation,
    # logging, and background image uploads are intentionally not awaited from
    # synchronous widget callbacks. Wrapping ~60 call sites in `unawaited()`
    # adds noise without changing behavior.
    discarded_futures: false
    # The error-handling convention is a bare `catch (e, st)` + logger.warn
    # at service/controller boundaries; specific failures are modeled as
    # typed Failure families instead of `on` clauses at every catch site.
    avoid_catches_without_on_clauses: false
    # The manual Riverpod style declares providers as inferred top-level
    # finals (`final xProvider = Provider<T>(...)`); spelling out the full
    # generic provider type on every declaration duplicates the right-hand
    # side without adding information.
    specify_nonobvious_property_types: false
